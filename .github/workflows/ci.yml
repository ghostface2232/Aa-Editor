name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            src-tauri

      - name: Install dependencies
        run: npm ci

      # src-tauri's generate_context! embeds the frontend dist at compile
      # time, so the app crate cannot even build without a real dist/.
      - name: Build frontend
        run: npm run build

      # The bootstrapper embeds the NSIS installer via include_bytes!; only
      # the release workflow has the real payload, so compile against an
      # empty placeholder here.
      - name: Create placeholder NSIS payload
        shell: pwsh
        run: New-Item -ItemType File -Path "bootstrapper\assets\nsis-payload.exe" -Force | Out-Null

      - name: Test helper workspace
        run: cargo test --workspace

      - name: Test Tauri app
        run: cargo test --manifest-path src-tauri/Cargo.toml
